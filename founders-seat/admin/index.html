<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Founder's Seat — Player stats</title>
<meta name="theme-color" content="#0B0D10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' fill='%230B0D10'/%3E%3Cpath d='M4 4h20v20H4zM4 12h20M12 12v12' fill='none' stroke='%23C9A45C' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0D10;--panel:#0F1318;--raised:#12161C;--hi:#161B22;--line:#1E242C;--line2:#2A323C;--ivory:#ECE6DA;--body:#B8BDC4;--muted:#8E959E;--faint:#7C838C;--accent:#C9A45C;--accent-hi:#E2C27F;--up:#7DB892;--down:#E08B7C;--serif:'Instrument Serif',Georgia,serif;--sans:'Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ink);color:var(--ivory);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hi)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:var(--ivory);font-family:var(--mono);font-size:12px;letter-spacing:.16em}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.eyebrow.acc{color:var(--accent)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,5vw,52px);line-height:1.05;margin:0}
.em{font-style:italic;color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line2);background:var(--panel)}
.kpi{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.kpi:last-child{border-right:0}
.kpi .v{font-family:var(--serif);font-size:34px;line-height:1}
.card{border:1px solid var(--line2);background:var(--panel);min-width:0}
.ch{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cb{padding:14px 16px}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 14px;text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
th{font-weight:400;font-size:10px;letter-spacing:.12em;color:var(--muted)}
td:first-child,th:first-child{text-align:left}
tbody tr{border-top:1px solid var(--line)}
td.l{text-align:left;font-family:var(--sans);font-size:13px}
.login{max-width:420px;border:1px solid var(--line2);background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:14px}
.login label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--body)}
.login input{height:44px;padding:0 12px;background:var(--raised);border:1px solid var(--line2);color:var(--ivory);font-size:15px;width:100%}
.login input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--down)}
.legend{display:flex;gap:16px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line2)}
.seg button{min-height:32px;padding:0 10px;background:transparent;border:0;border-right:1px solid var(--line2);cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--body)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--ink)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-bottom:1px solid var(--line)}}
.kpi{border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;min-height:20px;padding:0 7px;border:1px solid var(--line2);font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.pill.up{border-color:var(--up);color:var(--up)}.pill.acc{border-color:var(--accent);color:var(--accent)}.pill.down{border-color:var(--down);color:var(--down)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;border:1px solid var(--line2);background:#fff;color:#1f1f1f;font-size:14px;font-weight:500;cursor:pointer}
.grant{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.grant input{height:36px;padding:0 10px;background:var(--raised);border:1px solid var(--line2);color:var(--ivory);font-size:13px;min-width:200px;flex:1}
.grant input:focus{outline:none;border-color:var(--accent)}
.linkx{background:none;border:0;color:var(--down);cursor:pointer;font-family:var(--mono);font-size:11px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
(function () {
  'use strict';
  var SB = 'https://xxdxuuqmftxufvnkkuif.supabase.co', KEY = 'sb_publishable_-QIiye3pp3AmD6UvuBz__A_LtfUeg4F', SK = 'fs_auth_v1';
  var TABLE_URL = 'https://supabase.com/dashboard/project/xxdxuuqmftxufvnkkuif/editor';
  var root = document.getElementById('root'), sess = null, data = null, range = 30;
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function read() { try { return JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) { return null; } }
  function save() { try { if (sess) localStorage.setItem(SK, JSON.stringify(sess)); else localStorage.removeItem(SK); } catch (e) { } }
  function req(path, o) {
    o = o || {}; var h = { apikey: KEY, 'Content-Type': 'application/json' };
    if (o.auth && sess) h.Authorization = 'Bearer ' + sess.access_token;
    return fetch(SB + path, { method: o.method || 'GET', headers: h, body: o.body ? JSON.stringify(o.body) : undefined }).then(function (r) {
      return r.text().then(function (t) { var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { } if (!r.ok) throw new Error((j && (j.message || j.msg || j.error_description || j.error)) || 'HTTP ' + r.status); return j; });
    });
  }
  function take(j) { sess = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: { id: j.user.id, email: j.user.email } }; save(); }
  function fresh() {
    if (!sess) return Promise.reject(new Error('no session'));
    if (sess.expires_at - 90 > Date.now() / 1000) return Promise.resolve();
    return req('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: sess.refresh_token } }).then(take);
  }
  var brand = '<div class="top"><a class="brand" href="../"><svg width="22" height="22" viewBox="0 0 28 28" fill="none" stroke="#C9A45C" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="22" height="22"/><path d="M3 12h22M12 12v13"/></svg>FOUNDER\'S SEAT</a><span style="display:flex;gap:10px;align-items:center">' + '<a class="btn" href="../play/">Open the game</a><span id="who"></span></span></div>';

  function loginView(err) {
    root.innerHTML = brand + '<div><div class="eyebrow acc">Owner dashboard</div><h1>Player <span class="em">stats.</span></h1></div>' +
      '<form class="login" id="lf"><p class="note">Sign in with the owner account. Use the same email and password you created in the game; only the owner account can see these numbers.</p>' +
      '<button type="button" class="gbtn" id="gb">Continue with Google</button><p class="note" style="text-align:center">or with email</p>' +
      '<label>Email<input type="email" id="em" autocomplete="email" required></label><label>Password<input type="password" id="pw" autocomplete="current-password" required></label>' +
      (err ? '<p class="note err" role="alert">' + esc(err) + '</p>' : '') + '<button class="btn primary" type="submit">Sign in</button>' +
      '<p class="note">No account yet? <a href="../play/">Create one in the game</a> with the owner email, then come back.</p></form>';
    document.getElementById('gb').onclick = function () { location.href = SB + '/auth/v1/authorize?provider=google&redirect_to=' + encodeURIComponent(location.origin + location.pathname); };
    document.getElementById('lf').addEventListener('submit', function (e) {
      e.preventDefault();
      req('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value } })
        .then(take).then(load).catch(function (x) { loginView(/Invalid login/i.test(x.message) ? 'That email and password do not match.' : x.message); });
    });
  }
  function load() {
    root.innerHTML = brand + '<p class="note">Loading…</p>';
    fresh().then(function () { return req('/rest/v1/rpc/admin_stats', { method: 'POST', auth: true, body: {} }); })
      .then(function (j) { data = j; draw(); })
      .catch(function (x) {
        if (/not authorised/i.test(x.message)) { root.innerHTML = brand + '<div><div class="eyebrow acc">Owner dashboard</div><h1>Not the owner <span class="em">account.</span></h1></div><p class="note">You are signed in as ' + esc(sess.user.email) + ', which cannot view player stats.</p><p><button class="btn" id="so">Sign out</button></p>'; document.getElementById('so').onclick = signOut; }
        else if (/no session|JWT|refresh/i.test(x.message)) { sess = null; save(); loginView(); }
        else root.innerHTML = brand + '<p class="note err">Could not load stats: ' + esc(x.message) + '</p>';
      });
  }
  function grant(email, note, remove) {
    fresh().then(function () { return req('/rest/v1/rpc/admin_grant', { method: 'POST', auth: true, body: { p_email: email, p_note: note || null, p_remove: !!remove } }); })
      .then(function (g) { data.grants = g; draw(); }).catch(function (x) { var gfo = document.getElementById('gf'); if (gfo) gfo.insertAdjacentHTML('afterend', '<p class="note err" style="padding:0 16px 12px">Could not update access: ' + esc(x.message) + '</p>'); });
  }
  function signOut() { sess = null; save(); loginView(); }
  function csv(rows, name) {
    var t = rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }
  function fmtDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }
  function chart(days) {
    var W = 1100, H = 220, pl = 36, pr = 10, pt = 14, pb = 26;
    var n = days.length, max = Math.max(2, Math.max.apply(null, days.map(function (d) { return Math.max(d.players_logged_in, d.new_signups); })));
    var bw = (W - pl - pr) / Math.max(1, n), g = '';
    for (var i = 0; i <= 4; i++) { var v = Math.round(max * i / 4), y = pt + (1 - i / 4) * (H - pt - pb); g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#1E242C"/><text x="' + (pl - 6) + '" y="' + (y + 3.5) + '" text-anchor="end">' + v + '</text>'; }
    days.forEach(function (d, i) {
      var x = pl + i * bw, h1 = d.players_logged_in / max * (H - pt - pb), h2 = d.new_signups / max * (H - pt - pb);
      g += '<rect x="' + (x + bw * 0.12) + '" y="' + (H - pb - h1) + '" width="' + bw * 0.42 + '" height="' + h1 + '" fill="#C9A45C"><title>' + esc(d.day) + ': ' + d.players_logged_in + ' logged in</title></rect>';
      g += '<rect x="' + (x + bw * 0.56) + '" y="' + (H - pb - h2) + '" width="' + bw * 0.32 + '" height="' + h2 + '" fill="#7DB892"><title>' + esc(d.day) + ': ' + d.new_signups + ' new</title></rect>';
      if (n <= 14 || i % Math.ceil(n / 10) === 0) g += '<text x="' + (x + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(fmtDate(d.day)) + '</text>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Players logged in and new sign-ups per day"><g font-family="Geist Mono, monospace" font-size="10" fill="#8E959E">' + g + '</g></svg>';
  }
  function fillDays(daily, n) {
    var map = {}; daily.forEach(function (d) { map[d.day] = d; });
    var out = [], today = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
    for (var i = n - 1; i >= 0; i--) {
      var d = new Date(today); d.setDate(d.getDate() - i);
      var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      out.push(map[k] || { day: k, new_signups: 0, players_logged_in: 0, games_started: 0, games_finished: 0 });
    }
    return out;
  }
  function draw() {
    var t = data.totals, daily = data.daily || [], players = data.players || [];
    var days = fillDays(daily, range);
    var today = days[days.length - 1];
    root.innerHTML = brand + '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><div class="eyebrow acc">Owner dashboard · updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) + '</div><h1>' + today.players_logged_in + ' players <span class="em">today.</span></h1></div><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="rf">Refresh</button><a class="btn" href="' + TABLE_URL + '" target="_blank" rel="noopener">Raw tables in Supabase</a><button class="btn" id="so">Sign out</button></span></div>' +
      '<div class="kpis">' + [['PLAYERS SIGNED UP', t.players], ['ACTIVE, LAST 7 DAYS', t.active_7d], ['IN FREE TRIAL', t.in_trial == null ? '—' : t.in_trial], ['PAID', t.paid == null ? '—' : t.paid], ['REVENUE', t.revenue_inr == null ? '—' : '₹' + Number(t.revenue_inr).toLocaleString('en-IN')], ['PLAYER-DAYS', t.logins], ['GAMES STARTED', t.games], ['GAMES FINISHED', t.finished]].map(function (k) { return '<div class="kpi"><span class="eyebrow">' + k[0] + '</span><span class="v">' + esc(k[1]) + '</span></div>'; }).join('') + '</div>' +
      '<section class="card"><div class="ch"><span class="eyebrow">Daily activity</span><span style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="legend"><span><i style="background:#C9A45C"></i>Logged in</span><span><i style="background:#7DB892"></i>New sign-ups</span></span><span class="seg">' + [7, 30, 90].map(function (n) { return '<button type="button" data-r="' + n + '" aria-pressed="' + (range === n) + '">' + n + ' days</button>'; }).join('') + '</span></span></div><div class="cb">' + chart(days) + '</div></section>' +
      '<section class="card"><div class="ch"><span class="eyebrow">Logins per day</span><button class="btn" id="cd">Download CSV</button></div><div class="tscroll"><table><thead><tr><th>Date (IST)</th><th>Players logged in</th><th>New sign-ups</th><th>Games started</th><th>Games finished</th></tr></thead><tbody>' +
      days.slice().reverse().map(function (d) { return '<tr><td>' + esc(d.day) + '</td><td>' + d.players_logged_in + '</td><td>' + d.new_signups + '</td><td>' + d.games_started + '</td><td>' + d.games_finished + '</td></tr>'; }).join('') + '</tbody></table></div></section>' +
      '<section class="card"><div class="ch"><span class="eyebrow">Players · ' + players.length + '</span><button class="btn" id="cp">Download CSV</button></div><div class="tscroll"><table><thead><tr><th>Name</th><th>Email</th><th>College / company</th><th>Joined</th><th>Last seen</th><th>Sign-in</th><th>Access</th><th>Days active</th><th>Games</th><th>Best outcome</th></tr></thead><tbody>' +
      (players.length ? players.map(function (p) { return '<tr><td class="l">' + esc(p.name || '—') + '</td><td class="l">' + esc(p.email) + '</td><td class="l">' + esc(p.institution || '—') + '</td><td>' + esc((p.created_at || '').slice(0, 10)) + '</td><td>' + esc((p.last_seen || '').slice(0, 10)) + '</td><td>' + esc(p.provider || 'email') + '</td><td>' + (p.access ? '<span class="pill ' + ({ paid: 'up', granted: 'acc', trial: '', expired: 'down' }[p.access] || '') + '">' + esc(p.access.toUpperCase()) + '</span>' : '—') + '</td><td>' + p.days_active + '</td><td>' + p.games + '</td><td>' + (p.best_outcome != null ? '₹' + Number(p.best_outcome).toFixed(1) + ' Cr' : '—') + '</td></tr>'; }).join('') : '<tr><td colspan="10" class="l">No players yet.</td></tr>') + '</tbody></table></div></section>' +
      '<section class="card"><div class="ch"><span class="eyebrow">Free access · programmes and reviewers</span><span class="note">These emails skip the paywall.</span></div>' +
      '<form class="grant" id="gf"><input type="email" id="ge" placeholder="student@school.edu" required><input type="text" id="gn" placeholder="Note, e.g. MU PGP cohort 2026"><button class="btn primary" type="submit">Grant access</button></form>' +
      '<div class="tscroll"><table><thead><tr><th>Email</th><th>Note</th><th>Granted</th><th></th></tr></thead><tbody>' + ((data.grants || []).length ? data.grants.map(function (g) { return '<tr><td class="l">' + esc(g.email) + '</td><td class="l">' + esc(g.note || '') + '</td><td>' + esc((g.granted_at || '').slice(0, 10)) + '</td><td><button class="linkx" data-rm="' + esc(g.email) + '">Remove</button></td></tr>'; }).join('') : '<tr><td colspan="4" class="l">' + (data.grants ? 'No free-access emails yet.' : 'Run supabase/v3_paywall.sql to enable this.') + '</td></tr>') + '</tbody></table></div></section>' +
      '<section class="card"><div class="ch"><span class="eyebrow">Payments · ' + (data.payments || []).length + '</span></div><div class="tscroll"><table><thead><tr><th>Order</th><th>Email</th><th>Amount</th><th>Status</th><th>Created</th></tr></thead><tbody>' + ((data.payments || []).length ? data.payments.map(function (y) { return '<tr><td class="l">' + esc(y.merchant_order_id) + '</td><td class="l">' + esc(y.email || '') + '</td><td>₹' + esc(y.amount_inr) + '</td><td><span class="pill ' + (y.status === 'COMPLETED' ? 'up' : y.status === 'PENDING' ? 'acc' : 'down') + '">' + esc(y.status) + '</span></td><td>' + esc((y.created_at || '').slice(0, 16).replace('T', ' ')) + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="l">No payments yet.</td></tr>') + '</tbody></table></div></section>' +
      '<p class="note">"Players logged in" counts each player once per day (India time) when they open the game signed in. Games update every month played.</p>';
    document.getElementById('who').textContent = sess.user.email;
    document.getElementById('rf').onclick = load;
    document.getElementById('so').onclick = signOut;
    document.getElementById('cd').onclick = function () { csv([['date', 'players_logged_in', 'new_signups', 'games_started', 'games_finished']].concat(days.map(function (d) { return [d.day, d.players_logged_in, d.new_signups, d.games_started, d.games_finished]; })), 'founders-seat-daily.csv'); };
    document.getElementById('cp').onclick = function () { csv([['name', 'email', 'institution', 'joined', 'last_seen', 'sign_in', 'access', 'days_active', 'games', 'best_outcome_cr']].concat(players.map(function (p) { return [p.name, p.email, p.institution, p.created_at, p.last_seen, p.provider, p.access, p.days_active, p.games, p.best_outcome]; })), 'founders-seat-players.csv'); };
    var gf = document.getElementById('gf');
    if (gf) gf.onsubmit = function (e) { e.preventDefault(); grant(document.getElementById('ge').value, document.getElementById('gn').value, false); };
    root.querySelectorAll('[data-rm]').forEach(function (b) { b.onclick = function () { grant(b.getAttribute('data-rm'), null, true); }; });
    root.querySelectorAll('[data-r]').forEach(function (b) { b.onclick = function () { range = Number(b.getAttribute('data-r')); draw(); }; });
  }
  function hashLogin() {
    var p = new URLSearchParams(location.hash.replace(/^#/, ''));
    if (!p.get('access_token')) { if (p.get('error_description')) { history.replaceState(null, '', location.pathname); return Promise.reject(new Error(p.get('error_description'))); } return null; }
    var tok = { access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: Number(p.get('expires_in')) || 3600 };
    history.replaceState(null, '', location.pathname);
    return fetch(SB + '/auth/v1/user', { headers: { apikey: KEY, Authorization: 'Bearer ' + tok.access_token } }).then(function (r) { return r.json(); }).then(function (u) { tok.user = u; take(tok); });
  }
  var hl = hashLogin();
  if (hl) hl.then(load).catch(function (e) { loginView(e.message); });
  else { sess = read(); if (sess) load(); else loginView(); }
})();
</script>
</body>
</html>
