<style>
  :root { color-scheme: light;

  * { box-sizing:border-box; margin:0; }
  body { font:14px/1.45 'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:16px; }
  header { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px; margin-bottom:4px; }
  h1 { font-size:20px; color:var(--accent); }
  .stamp { color:var(--muted); font-size:12px; }
  .note { font-size:12px; color:var(--muted); margin:6px 0 14px; }
  nav { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  nav button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px; border-radius:20px; cursor:pointer; font-size:13px; font-weight:600; }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  section.tab { display:none; }
  section.tab.active { display:block; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 8px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:10px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .tile .v { font-size:20px; font-weight:700; color:var(--accent); margin:2px 0 0; }
  .tile .l { font-size:11.5px; color:var(--muted); }
  .tile .d { font-size:11px; color:var(--muted); margin-top:2px; }
  .tile .chg { display:block; font-size:11px; font-weight:700; margin-top:1px; }
  .chg.up { color:var(--up); } .chg.down { color:var(--down); }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  .chartbox { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; height:280px; position:relative; }
  .chartbox h3 { font-size:12.5px; color:var(--ink); margin-bottom:6px; }
  .chartbox .cwrap { position:absolute; inset:36px 12px 10px 12px; }
  .ctrl { display:inline-flex; gap:4px; margin:6px 8px 6px 0; background:var(--chip); border-radius:16px; padding:3px; }
  .ctrl button { border:0; background:transparent; padding:4px 12px; border-radius:13px; font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; }
  .ctrl button.on { background:var(--accent); color:#fff; }
  .twrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); font-size:12.5px; }
  th { background:var(--chip); text-align:left; padding:7px 9px; color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
  th.sortable { cursor:pointer; } th.sortable:after { content:" ↕"; color:var(--muted); }
  td { padding:7px 9px; border-top:1px solid var(--line); vertical-align:top; }
  .src { font-size:11px; color:var(--muted); margin-top:8px; }
  .src a { color:var(--accent2); }
  .flag { display:inline-block; background:#fdf3e3; color:#8a5b00; font-size:10.5px; padding:1px 7px; border-radius:9px; margin-left:5px; }
  .fn { font-size:11px; color:var(--muted); margin-top:5px; }
  .zones { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:10px; }
  .zone { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent2); border-radius:10px; padding:10px 12px; cursor:pointer; }
  .zone:hover { border-color:var(--accent); }
  .zone.sel { background:var(--chip); border-left-color:var(--accent); }
  .zone .zn { font-weight:700; font-size:13px; color:var(--accent); }
  .zone .zc { font-size:11px; color:var(--muted); margin:3px 0; }
  .zone .zr { font-size:11.5px; }
  .zpanel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:10px; }
  .zpanel h4 { color:var(--accent); font-size:14px; margin-bottom:6px; }
  .flow { font-size:11.5px; color:var(--muted); margin:8px 0; }
  .up2 { color:var(--up); font-weight:700; } .down2 { color:var(--down); font-weight:700; }
  a { color:var(--accent2); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 10px; }
  .chips a { background:var(--chip); border:1px solid var(--line); border-radius:14px; padding:4px 12px; font-size:12px; font-weight:600; text-decoration:none; color:var(--accent); }
  .tl { border-left:3px solid var(--accent2); margin:4px 0 8px 6px; }
  .tl-e { padding:8px 12px 8px 16px; cursor:pointer; position:relative; }
  .tl-e:before { content:""; position:absolute; left:-8px; top:14px; width:11px; height:11px; border-radius:50%; background:var(--card); border:3px solid var(--accent2); }
  .tl-e:hover { background:var(--chip); }
  .tl-date { display:inline-block; font-size:11px; font-weight:700; color:var(--accent2); margin-right:10px; min-width:70px; }
  .tl-d { display:none; font-size:12.5px; color:var(--muted); margin-top:5px; max-width:900px; }
  .tl-e.open .tl-d { display:block; }
  .newslist { display:flex; flex-direction:column; gap:8px; }
  .newsitem { display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 14px; text-decoration:none; color:var(--ink); }
  .newsitem:hover { border-color:var(--accent2); background:#fbfcff; }
  .nd { min-width:52px; font-size:11.5px; font-weight:700; color:var(--accent2); padding-top:2px; }
  .ntag { min-width:66px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#8a5b00; background:#fdf3e3; border-radius:9px; padding:2px 8px; text-align:center; margin-top:1px; }
  .nbody { display:flex; flex-direction:column; gap:2px; }
  .nbody b { font-size:14px; color:var(--ink); }
  .ngist { font-size:12.5px; color:var(--muted); }
</style>

PAY.share=(i)=>{ // interpolate anchors -> [pp,gp]
  const A=PAY.shareAnchors;
  for(let k=0;k<A.length-1;k++){ const [i0,p0,g0]=A[k],[i1,p1,g1]=A[k+1];

};

const AX = { plugins:{legend:{labels:{boxWidth:12,font:{size:11}}}}, interaction:{mode:"index",intersect:false}, responsive:true, maintainAspectRatio:false,
  scales:{ x:{grid:{display:false},ticks:{font:{size:10},maxTicksLimit:14}}, y:{grid:{color:"#eef0f6"},ticks:{font:{size:11}}} } };
const C1="#1f3864", C2="#2e9bd6", C3="#e8a33d", C4="#0a7d4f", C5="#8a5b00", C6="#b3261e", C7="#7a5fd0", C8="#c3ccdd";

// ---------- payments charts & interactions ----------
const payState={ range:60, apps:["all"], basis:"volPct" };
let chVol, chVal, chPie1, chPie2;
const APPDEFS={ all:{n:"All UPI",c:"#1f3864"}, pp:{n:"PhonePe ≈",c:"#5f259f"}, gp:{n:"Google Pay ≈",c:"#2e9bd6"}, ot:{n:"Others ≈",c:"#b3261e"} };

function paySeries(kind, app){ // kind: 'vol'|'val'; app: 'all'|'pp'|'gp'|'ot'
  const base=PAY[kind], n=base.length, from=n-payState.range;
  const idx=[...Array(n).keys()].slice(from);
  return idx.map(i=>{
    const [pp,gp]=PAY.share(i);
    const f= app==="all"?100: app==="pp"?pp: app==="gp"?gp: (100-pp-gp);
    return +(base[i]*f/100).toFixed(2);
  });
}
function payLabels(){ const n=PAY.labels.length; return PAY.labels.slice(n-payState.range); }
function updatePayTrend(){
  const labels=payLabels();
  const mk=(kind,unit)=>payState.apps.map(a=>({
    label:APPDEFS[a].n+" "+unit, data:paySeries(kind,a), borderColor:APPDEFS[a].c,
    backgroundColor:payState.apps.length===1?APPDEFS[a].c+"18":"transparent",
    fill:payState.apps.length===1, tension:.25, pointRadius:0, pointHitRadius:12, borderWidth:2 }));
  chVol.data.labels=labels; chVol.data.datasets=mk("vol","(B)"); chVol.update();
  chVal.data.labels=labels; chVal.data.datasets=mk("val","(₹ L cr)"); chVal.update();
}
function pieTip(items){ // build tooltip lines with % + volume + value
  return {
    callbacks:{ label:(ctx)=>{
      const a=items[ctx.dataIndex];
      return ` ${a.n}: ${ctx.parsed}%  ·  ${(a.volPct*PAY.latest.volB/100).toFixed(2)}B txns  ·  ₹${(a.valPct*PAY.latest.valL/100).toFixed(2)} L cr`;
    } } };
}
function updatePies(){
  const b=payState.basis;
  const main=[PAY.apps[0],PAY.apps[1],PAY.apps[2],{n:"Others (rest)",volPct:+(100-PAY.apps[0].volPct-PAY.apps[1].volPct-PAY.apps[2].volPct).toFixed(1),valPct:+(100-PAY.apps[0].valPct-PAY.apps[1].valPct-PAY.apps[2].valPct).toFixed(1)}];
  chPie1.data.labels=main.map(a=>a.n); chPie1.data.datasets[0].data=main.map(a=>a[b]);
  chPie1.options.plugins.tooltip=pieTip(main); chPie1.update();
  const tail=PAY.apps.slice(2); const tot=tail.reduce((s,a)=>s+a[b],0);
  chPie2.data.labels=tail.map(a=>a.n); chPie2.data.datasets[0].data=tail.map(a=>+(a[b]/tot*100).toFixed(1));
  chPie2.options.plugins.tooltip=pieTip(tail); chPie2.update();
}

function initPayments(){
  chVol=new Chart($("#c-pvol"),{type:"line",data:{labels:[],datasets:[]},options:AX});
  chVal=new Chart($("#c-pval"),{type:"line",data:{labels:[],datasets:[]},options:AX});
  updatePayTrend();
  // share trend lines (5Y, volume basis)
  const pp=[],gp=[],ot=[];
  for(let i=0;i<60;i++){ const [p,g]=PAY.share(i); pp.push(+p.toFixed(1)); gp.push(+g.toFixed(1)); ot.push(+(100-p-g).toFixed(1)); }
  new Chart($("#c-sharetrend"),{type:"line",data:{labels:PAY.labels,datasets:[
    {label:"PhonePe",data:pp,borderColor:C1,pointRadius:0,tension:.25},
    {label:"Google Pay",data:gp,borderColor:C2,pointRadius:0,tension:.25},
    {label:"Others",data:ot,borderColor:C6,pointRadius:0,tension:.25}]},
    options:{...AX,scales:{...AX.scales,y:{...AX.scales.y,min:0,max:60}}}});
  chPie1=new Chart($("#c-pie1"),{type:"doughnut",data:{labels:[],datasets:[{data:[],backgroundColor:[C1,C2,C3,C8]}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{boxWidth:12,font:{size:11}}}}}});
  chPie2=new Chart($("#c-pie2"),{type:"doughnut",data:{labels:[],datasets:[{data:[],backgroundColor:[C3,C4,C7,C5,C6,C2,C1,C8]}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{boxWidth:12,font:{size:11}}}}}});
  updatePies();
  const tk=Object.keys(PAY.tail), tc=[C3,C4,C7,C5,C6];
  new Chart($("#c-tailbar"),{type:"bar",data:{labels:PAY.tailQuarters,datasets:tk.map((k,i)=>({label:k,data:PAY.tail[k],backgroundColor:tc[i]}))},options:AX});
  // controls
  $("#payRange").addEventListener("click",e=>{ if(!e.target.dataset.r)return;
    payState.range=+e.target.dataset.r; [...$("#payRange").children].forEach(b=>b.classList.toggle("on",b===e.target)); updatePayTrend(); });
  $("#payApp").addEventListener("click",e=>{ const a=e.target.dataset.a; if(!a)return;
    if(a==="all"){ payState.apps=["all"]; }
    else {
      payState.apps=payState.apps.filter(x=>x!=="all");
      if(payState.apps.includes(a)) payState.apps=payState.apps.filter(x=>x!==a);
      else payState.apps.push(a);
      if(payState.apps.length===0) payState.apps=["all"];
    }
    [...$("#payApp").children].forEach(b=>b.classList.toggle("on",payState.apps.includes(b.dataset.a)));
    updatePayTrend(); });
  $("#payBasis").addEventListener("click",e=>{ if(!e.target.dataset.b)return;
    payState.basis=e.target.dataset.b; [...$("#payBasis").children].forEach(b=>b.classList.toggle("on",b===e.target)); updatePies(); });
  // (table sorting is handled globally — see delegated handler at bottom)
  // value chain zones
  $("#zones").addEventListener("click",e=>{
    const zEl=e.target.closest(".zone"); if(!zEl)return;
    document.querySelectorAll(".zone").forEach(x=>x.classList.remove("sel")); zEl.classList.add("sel");
    const z=PAY.zones[+zEl.dataset.z];
    $("#zpanel").innerHTML=`<h4>${z.n}</h4><div class="fn">Section revenue: <b>${z.rev}</b> · Profitability: ${z.prof}</div>`
      + tableHTML(["Company","Value added to the chain","Key tech / APIs & where sourced (company · govt · think-tank)"], z.cos);
  });
}

      {type:"line",label:"# deals",data:d.q1Compare.deals,borderColor:C3,backgroundColor:C3,yAxisID:"y1"}]},
      options:{...AXc,scales:{...AXc.scales,y1:{position:"right",grid:{display:false}}}}});
  }
}

function activate(id){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===id));
  document.querySelectorAll("section.tab").forEach(s=>s.classList.toggle("active",s.id==="tab-"+id));
  initCharts(id);
}

// global: sortable tables (any tab) — click column headers
document.addEventListener("click",(e)=>{
  const th=e.target.closest("table.sort-t th.sortable");
  if(th){
    const tbl=th.closest("table"), tb=tbl.querySelector("tbody"), c=+th.dataset.c;
    const rows=[...tb.rows]; const dir=th.dataset.dir==="asc"?-1:1; th.dataset.dir=dir===1?"asc":"desc";
    rows.sort((a,b2)=>{
      const av=a.cells[c].querySelector("[data-v]"), bv=b2.cells[c].querySelector("[data-v]");
      if(av&&bv) return (parseFloat(av.dataset.v)-parseFloat(bv.dataset.v))*dir;
      return a.cells[c].textContent.localeCompare(b2.cells[c].textContent)*dir;
    });
    rows.forEach(r=>tb.appendChild(r));
    return;
  }
  // regulation timeline accordion
  const ev=e.target.closest(".tl-e");
  if(ev){ ev.classList.toggle("open"); return; }
  // lending value-chain zones
  const lz=e.target.closest("#lzones .lzone");
  if(lz){
    document.querySelectorAll("#lzones .lzone").forEach(x=>x.classList.remove("sel")); lz.classList.add("sel");
    const z=DATA.lending.zones[+lz.dataset.z];
    document.getElementById("lzpanel").innerHTML=`<h4>${z.n}</h4><div class="fn">${z.rev} · ${z.prof}</div>`
      + tableHTML(["Player","Value added","Second-order detail"], z.cos);
    return;
  }
  // wealth value-chain zones
  const wz=e.target.closest("#wzones .wzone");
  if(wz){
    document.querySelectorAll("#wzones .wzone").forEach(x=>x.classList.remove("sel")); wz.classList.add("sel");
    const z=DATA.wealthtech.zones[+wz.dataset.z];
    document.getElementById("wzpanel").innerHTML=`<h4>${z.n}</h4><div class="fn">${z.rev} · ${z.prof}</div>`
      + tableHTML(["Player","Value added","Second-order detail"], z.cos);
  }
});

activate("payments");

// ---- Google sign-in (activates once GOOGLE_CLIENT_ID is set) ----
const GOOGLE_CLIENT_ID = "461037824839-k8bl12d0nv1qh98jardfjue4mvmqr50c.apps.googleusercontent.com";
function showUser(u){
  try{
    document.getElementById("gsi-btn").style.display="none";
    const chip=document.getElementById("userchip");
    chip.style.display="flex";
    document.getElementById("username").textContent=(u.name||u.email||"").split(" ")[0];
    if(u.picture) document.getElementById("userpic").src=u.picture;
  }catch(e){}
}
function initAuth(){
  if(!GOOGLE_CLIENT_ID) return;
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem("fd_user")||"null"); }catch(e){}
  if(saved){ showUser(saved); return; }
  const s=document.createElement("script");
  s.src="https://accounts.google.com/gsi/client"; s.async=true; s.defer=true;
  s.onload=function(){
    try{
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: (resp)=>{
        try{
          const p=JSON.parse(atob(resp.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
          const u={ sub:p.sub, name:p.name, email:p.email, picture:p.picture, ts:Date.now() };
          try{ localStorage.setItem("fd_user", JSON.stringify(u)); }catch(e){}
          showUser(u);
          // future: POST u + visit event to backend (Supabase/Sheet) here
        }catch(e){}
      }});
      google.accounts.id.renderButton(document.getElementById("gsi-btn"), { theme:"outline", size:"medium", shape:"pill", text:"signin_with" });
    }catch(e){}
  };
  document.head.appendChild(s);
}
document.getElementById("signout").addEventListener("click",(e)=>{
  e.preventDefault();
  try{ localStorage.removeItem("fd_user"); }catch(err){}
  location.reload();
});
initAuth();
