# After a data change reaches main: wait for GitHub Pages, load the live page, and if it's broken,
# open a revert pull request straight away.
name: SUPAG smoke test

on:
  push:
    branches: [main]
    paths: ["dashboard/data/**", "fintech_dashboard.html"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for GitHub Pages to serve this commit's data
        run: |
          want=$(python3 -c "import json;print(json.load(open('dashboard/data/meta.json'))['lastUpdatedISO'])")
          for i in $(seq 1 40); do
            got=$(curl -fsS "https://fintech.pelicanx.in/dashboard/data/meta.json?nocache=$RANDOM" | python3 -c "import sys,json;print(json.load(sys.stdin)['lastUpdatedISO'])" 2>/dev/null || true)
            [ "$got" = "$want" ] && { echo "Live after ~$((i*15))s"; exit 0; }
            sleep 15
          done
          echo "::warning::Pages still serving older data after 10 minutes; testing anyway."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: supag/requirements.txt
      - run: |
          pip install -r supag/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Smoke-test the live page
        id: smoke
        continue-on-error: true
        run: python -m supag.run --mode smoke --report "$RUNNER_TEMP/smoke.md"
      - if: always()
        run: cat "$RUNNER_TEMP/smoke.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Live page is broken — open a revert pull request
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          SHA="${{ github.sha }}"; SHORT="${SHA::7}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "supag/revert-$SHORT"
          if [ "$(git rev-list --parents -n1 "$SHA" | wc -w)" -gt 2 ]; then git revert --no-edit -m 1 "$SHA"; else git revert --no-edit "$SHA"; fi
          git push origin "supag/revert-$SHORT"
          { echo "@$OWNER — the live dashboard failed its smoke test after $SHORT. Merging this reverts it."; echo; cat "$RUNNER_TEMP/smoke.md"; } > "$RUNNER_TEMP/tmp.md" && mv "$RUNNER_TEMP/tmp.md" "$RUNNER_TEMP/smoke.md"
          gh label create supag --color 1F3864 --description "Opened by SUPAG" 2>/dev/null || true
          gh pr create --base main --head "supag/revert-$SHORT" --title "Revert $SHORT: live dashboard failed its smoke test" --body-file "$RUNNER_TEMP/smoke.md" --label supag
          exit 1
